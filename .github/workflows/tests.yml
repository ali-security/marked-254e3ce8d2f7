name: "Tests"
on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: "Optional jasmine spec-name filter; empty runs the full suite"
        required: false
        default: ''

jobs:
  Test:
    strategy:
      fail-fast: false
      matrix:
        # Upstream's matrix was ['lts/*', 'node'], which at the 2021-05-27 release
        # date resolved to Node 14 (LTS) and Node 16 (current). Pinned to those
        # exact versions because the floating labels now resolve to Node 22/24,
        # which cannot run this 2021 dependency tree. Node 8 is not usable here:
        # the lockfile pins jasmine@3.7.0, whose lib/loader.js uses dynamic
        # import() and is a SyntaxError on Node 8, so the suite cannot start.
        node_version: ['14', '16']
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node_version }}
      - name: Pin registry to release date 2021-05-27
        run: |
          npm config set registry https://time-machines-npm.sealsecurity.io/
          npm config set //time-machines-npm.sealsecurity.io/:_authToken=2021-05-27T00:00:00.000000Z
      - name: Install Dependencies
        run: npm ci
      - name: Run Unit Tests 👩🏽‍💻
        run: |
          if [ -n "${{ inputs.test-filter }}" ]; then
            npm test -- test/unit/**/*-spec.js --filter="${{ inputs.test-filter }}"
          else
            npm run test:unit
          fi
      - name: Run Spec Tests 👩🏽‍💻
        run: |
          if [ -n "${{ inputs.test-filter }}" ]; then
            npm test -- test/specs/**/*-spec.js --filter="${{ inputs.test-filter }}"
          else
            npm run test:specs
          fi

  Pack:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 14.17.0
      - name: Install the publishing npm
        run: |
          npm i -g npm@7.12.0
          node --version
          npm --version
      - name: Pack 📦
        run: npm pack
      - name: Upload Tarball
        uses: actions/upload-artifact@v4
        with:
          name: marked-2.0.6-tgz
          path: marked-2.0.6.tgz
          if-no-files-found: error
